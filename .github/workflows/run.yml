name: Generate Man Utd Calendar

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          # football-data.org 免费 token，请在仓库 Settings -> Secrets 里添加同名 Secret
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # 可选：TheSportsDB 的 key，不设则用公开的免费 key "123"
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
        run: python generate.py

      - name: Validate ics for iPhone import
        run: python validate_ics.py matches.ics

      - name: Commit generated ics file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add matches.ics
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update calendar"
          git push
